name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to checkout and publish (e.g., v2.0.0)'
        required: true
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish-and-release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag) || github.ref }}

      - name: Verify tag exists (only for dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags
          if ! git rev-parse --verify "refs/tags/${{ github.event.inputs.tag }}" > /dev/null; then
            echo "ERROR: Tag '${{ github.event.inputs.tag }}' does not exist"
            echo "Available tags:"
            git tag --sort=-version:refname | head -10
            exit 1
          fi
          echo "Tag '${{ github.event.inputs.tag }}' verified successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish to NPM
        run: |
          chmod +x scripts/publish-npm
          ./scripts/publish-npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
